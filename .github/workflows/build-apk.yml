name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Mobile APK
    runs-on: ubuntu-24.04  # 修复4: 显式指定版本，避免 ubuntu-latest 迁移问题

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # 修复1: 升级Node.js版本

      - name: Set up Java JDK
        uses: actions/setup-java@v5  # 修复2: 升级setup-java到v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true  # 修复3: 使用正确的输入参数
          cmdline-tools-version: '11076708'

      - name: Install dependencies
        run: npm install

      - name: Check Capacitor config
        run: test -f capacitor.config.json && echo "Config found" || (echo "Missing capacitor.config.json" && exit 1)

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css www/
          cp -r js www/
          cp -r assets www/
          cp manifest.json www/
          echo "Web assets prepared in www/"

      - name: Add Android platform
        run: npx cap add android  # 修复4: 去掉 || true，让错误可见

      - name: Sync Android project
        run: npx cap sync android

      - name: Set Android version
        run: |
          BUILD_GRADLE=android/app/build.gradle
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's/versionCode [0-9]*/versionCode 8/' "$BUILD_GRADLE"
            sed -i 's/versionName "[0-9.]*"/versionName "1.8.0"/' "$BUILD_GRADLE"
            echo "Version set to 1.8.0 (code: 8)"
          fi

      - name: Update Android manifest permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
              sed -i '/<\/manifest>/i \
                <uses-permission android:name="android.permission.CAMERA" />\
                <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
                <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
                <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
                <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\
                <uses-permission android:name="android.permission.INTERNET" />\
                <uses-feature android:name="android.hardware.camera" android:required="true" />\
                <uses-feature android:name="android.hardware.camera.autofocus" />' "$MANIFEST"
            fi
          fi

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon -x lintVitalAnalyzeRelease

      - name: List built APK files
        run: find android -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: moxi-watermark-camera-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
